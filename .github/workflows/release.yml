name: Release

# Publishes the default bake target to GHCR when a version tag is pushed.
# Tag v1.2.3 -> ghcr.io/<owner>/<repo>:1.2.3

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "Publishing ${IMAGE}:${VERSION}"

          readarray -t TARGETS < <(docker buildx bake --print default | jq -r '.target | keys[]')
          ARGS=()
          for target in "${TARGETS[@]}"; do
            case "$target" in
              *-trixie-systemd-*) VARIANT="-trixie-systemd" ;;
              *-systemd-*)        VARIANT="-systemd" ;;
              *-trixie-*)         VARIANT="-trixie" ;;
              *)                  VARIANT="" ;;
            esac
            ARGS+=(--set "${target}.tags=${IMAGE}:${VERSION}${VARIANT}")
          done
          docker buildx bake --push "${ARGS[@]}" default
