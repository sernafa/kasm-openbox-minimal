name: Manual build

# Build and publish any bake target to GHCR on demand.
# The published tag is <version><variant suffix>; e.g. choosing
# openbox-systemd-1_0_0 with version 1.0.0 publishes
# ghcr.io/<owner>/<repo>:1.0.0-systemd.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bake target to build"
        required: true
        type: choice
        default: "openbox-1_0_0"
        options:
          - openbox-1_0_0
          - openbox-systemd-1_0_0
          - openbox-trixie-1_0_0
          - openbox-trixie-systemd-1_0_0
          - all
      version:
        description: "Version tag to publish (e.g. 1.0.0, latest, test)"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "Publishing ${IMAGE}:${VERSION} (target: ${TARGET})"

          readarray -t TARGETS < <(docker buildx bake --print "${TARGET}" | jq -r '.target | keys[]')
          ARGS=()
          for t in "${TARGETS[@]}"; do
            case "$t" in
              *-trixie-systemd-*) VARIANT="-trixie-systemd" ;;
              *-systemd-*)        VARIANT="-systemd" ;;
              *-trixie-*)         VARIANT="-trixie" ;;
              *)                  VARIANT="" ;;
            esac
            ARGS+=(--set "${t}.tags=${IMAGE}:${VERSION}${VARIANT}")
          done
          docker buildx bake --push "${ARGS[@]}" "${TARGET}"
